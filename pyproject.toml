[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inotes-client"
version = "0.1.1"
description = "inotes-client — Apple Notes CLI + agent schema (Typer). Binary: inotes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ml-lubich" }]
keywords = ["apple-notes", "macos", "cli", "agent", "typer", "notes"]
classifiers = [
    "Environment :: MacOS X",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/ml-lubich/inotes"
Repository = "https://github.com/ml-lubich/inotes"

[project.scripts]
inotes = "inotes.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/inotes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
